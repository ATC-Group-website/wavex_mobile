workflows:
  android-release:
    name: Wavex Android Release
    max_build_duration: 120
    instance_type: linux_x2

    environment:
      # Replace this with the keystore reference you create in Codemagic.
      android_signing:
        - wavex_release_keystore
      groups:
        # This group must contain the secret variable
        # GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS.
        - google_play
      vars:
        PACKAGE_NAME: com.wavex.app
        GOOGLE_PLAY_TRACK: internal
      flutter: stable

    scripts:
      - name: Set up Flutter Android configuration
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze Flutter project
        script: flutter analyze
        # Existing lint issues are reported but should not block a release build.
        ignore_failure: true

      - name: Run Flutter tests
        script: flutter test

      - name: Build signed Android App Bundle
        script: |
          latest_build_number="$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --tracks="$GOOGLE_PLAY_TRACK" 2>/dev/null || true)"

          if [[ "$latest_build_number" =~ ^[0-9]+$ ]]; then
            build_number=$((latest_build_number + 1))
          else
            # This is used for the first upload, before the app exists on Play.
            build_number=1
          fi

          flutter build appbundle \
            --release \
            --build-name=1.0.0 \
            --build-number="$build_number"

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK
        # Keep the first automated upload as a draft until Play Console setup
        # and store listing requirements are complete.
        submit_as_draft: true
